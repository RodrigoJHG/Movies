<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flying-V Gas Station</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scene" role="img" aria-label="A Googie gas station at night in the desert. A tangerine butterfly canopy shaped like a flying V stands on one tapered concrete column; under its front edges, which glow cream, its lit underside carries a row of downlights. Two rounded 1950s pumps with glowing globes, number windows and hoses stand on a striped concrete island in a pool of light. Beside them is a service garage with an orange roof overhang reading Service, a lit office window and teal bay doors. A tall sign on a concrete base has a glowing orange ball reading Gas inside a tilted teal ring, a small moon orbiting the ring, over a clamped price board reading Regular 26 and nine tenths. Every part casts a hard shadow, and dark mesas and stars sit behind.">
      <div class="stars"></div>
      <div class="mesa" data-n="far"></div>
      <div class="mesa" data-n="near"></div>
      <div class="apron"></div>
      <div class="road"></div>
      <div class="garage">
        <div class="garage-office"></div>
        <div class="garage-bay" data-n="1"></div>
        <div class="garage-bay" data-n="2"></div>
      </div>
      <div class="garage-roof">Estacion de servicio</div>
      <div class="soffit"></div>
      <div class="downlights" data-n="left"></div>
      <div class="downlights" data-n="right"></div>
      <div class="column"></div>
      <div class="wing" data-n="left"></div>
      <div class="wing" data-n="right"></div>
      <div class="edges">
        <div class="wing-edge" data-n="left"></div>
        <div class="wing-edge" data-n="right"></div>
      </div>
      <div class="island"></div>
      <div class="pump-base" data-n="1"></div>
      <div class="pump-base" data-n="2"></div>
      <div class="hose" data-n="1"></div>
      <div class="hose" data-n="2"></div>
      <div class="pump" data-n="1"><span>Gas</span></div>
      <div class="pump" data-n="2"><span>Gas</span></div>
      <div class="globe" data-n="1"></div>
      <div class="globe" data-n="2"></div>
      <div class="sign-base"></div>
      <div class="pole"></div>
      <div class="price"><span class="price-kind">Regular</span><span class="price-cents">26<sup>9</sup></span></div>
      <div class="ring" data-part="back"></div>
      <div class="moon-path"><div class="moon"></div></div>
      <div class="ball">Dinoco</div>
      <div class="logo"><img src="https://logodix.com/logo/1858257.png" alt="Dinoco Logo" /></div>
      <div class="ring" data-part="front"></div>
    </div>
  </body>
</html>
